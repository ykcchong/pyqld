[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyqld"
version = "0.2.0"
description = "Read Waters TargetLynx .qld quantitation files on any platform"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Calvin Chong"},
]
keywords = [
    "targetlynx",
    "masslynx",
    "waters",
    "lc-ms",
    "quantitation",
    "chromatography",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
]
requires-python = ">=3.10"
dependencies = [
    "olefile>=0.47",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "cloudpickle>=3.0",
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme",
]

[project.urls]
Homepage = "https://github.com/calvinchong/pyqld"
Repository = "https://github.com/calvinchong/pyqld"
Documentation = "https://pyqld.readthedocs.io"
"Bug Reports" = "https://github.com/calvinchong/pyqld/issues"

[project.scripts]
pyqld = "pyqld.cli:main"

[tool.setuptools.packages.find]
include = ["pyqld*"]

[tool.setuptools.package-data]
pyqld = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 96

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
[[tool.mypy.overrides]]
module = ["olefile"]
ignore_missing_imports = true
